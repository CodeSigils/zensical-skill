name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit message policy
        run: |
          RANGE="${{ github.event.pull_request.base.sha || github.event.before }}..HEAD"
          if git rev-parse "$RANGE" >/dev/null 2>&1; then
            python3 scripts/check_commit_messages.py "$RANGE"
          else
            echo "::warning::Range $RANGE not resolvable; checking HEAD only"
            python3 scripts/check_commit_messages.py HEAD
          fi

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A shallow checkout is sufficient here: the fixtures are synthetic and
      # no fixture enables a plugin that reads dates from Git. Raise the depth
      # before adding a fixture that does, or it will silently date every item
      # to the build time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run scenario suite
        run: bash scripts/run_scenarios.sh

  payload-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Instruction contract self-test
        run: python3 zensical/scripts/check_instruction_contract.py --self-test
      - name: Site hygiene scan
        run: bash zensical/scripts/check_site_hygiene.sh .
      - name: README inventory self-test
        run: python3 scripts/check_readme_inventory.py --self-test
      - name: README inventory
        run: python3 scripts/check_readme_inventory.py
      - name: Lint the local checks
        run: uvx ruff@0.15.16 check .
